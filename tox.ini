[tox]
skipsdist = True
skip_missing_interpreters = True
envlist = lint, unit
# The environments are synced from uv.lock, the same file charmcraft builds the
# charm's venv from, so tests run against the dependencies that get shipped.
requires = tox-uv>=1.13

[vars]
src_path = {toxinidir}/src
tst_path = {toxinidir}/tests

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{[vars]src_path}
    PYTHONBREAKPOINT = ipdb.set_trace

[testenv:lint]
description = Check code against coding style standards
runner = uv-venv-lock-runner
dependency_groups = lint
commands =
    ruff check {[vars]src_path} {[vars]tst_path}
    ruff format --check {[vars]src_path} {[vars]tst_path}

[testenv:unit]
description = Run unit tests
runner = uv-venv-lock-runner
dependency_groups = unit
commands = pytest -v {posargs}
